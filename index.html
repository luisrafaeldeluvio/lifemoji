<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <script type="module" src="scripts/script.js" async></script>
    <title>Document</title>
  </head>
  <body>
    <aside class="panel">

      <section class="panel__profile card">
        <img src="./assets/smart_car.jpg" alt="profile" />
        <span class="text--m js-profile">male, 21</span>
      </section>
      
      <section class="panel__info card">
        <p class="js-fullname text--m">john doe</p>
        <p class="text--m">status</p>
        <p class="js-money text--m"> $2,379.21</p>
      </section>

      <section class="panel__stats card">
        <p class="js-stat-joy">🙂</p>
        <p class="js-stat-health">❤️</p>
        <p class="js-stat-smarts">🧠</p>
        <p class="js-stat-looks">👀</p>
      </section>

    </aside>
    <main class="main">
      
      <nav class="main__secondary-nav">
         <ul>
          <li>❤️</li>
          <li>💵</li>
          <li>🏆</li>
          <li>💼</li>
        </ul>
      </nav>

      <div class="main__journal">
        <article class="main__journal__container main__journal--opened">
          <div class="main__journal__holes"></div>
          <div class="main__journal__dashes"></div>
          
          <div class="main__journal__paper js-journal"></div>
        </article>
        <article class="main__journal__social ">fdtj</article>
      </div>
       
      <nav class="main__primary-nav">
        <ul>
          <li>Journal</li>
          <!-- on hover, curl as if going to flip -->
          <li>Skills</li>
          <li>School</li>
          <li>Hobbies</li>
          <li>Others</li>
        </ul>
      </nav>

    </main>


    <footer>
      <button class="js-growup">Pencil</button>
      <button>Eraser</button>
    </footer>
  </body>
</html>

<!-- a cork board where players can see their past characters -->
