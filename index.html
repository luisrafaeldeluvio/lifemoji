<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav class="nav"> <!-- post-it notes -->
		<section class="nav-profile -section"> <!-- profile  -->
			<img src="" alt="profile"> <!-- or just use svg -->
			<span>male, 21</span>
		</section> 
		<section class="nav-info -section"> <!-- info -->
			<p>john doe</p>
			<p>status</p>
			<p>$2,379.21</p>
		</section>
		<section class="nav-stats -section"> <!-- stats -->
			<p>health</p>
			<p>happiness</p>
			<p>intelligence</p>
		</section>
        <button class="nav-btn">More</button> <!-- To clipboard -->
    </nav> 
    <main class="main">
        <article class="main-journal"> <!-- notebook -->
        </article>
        <aside class="main-nav"> <!-- bookmarks -->
            <nav>
                <ul>
                    <li>Journal</li>
                    <li>Goals</li>
                    <li>Skills</li>
                    <li>School</li>
                    <li>Work</li>
                    <li>Relations</li>
                    <li>Hobbies</li>
                    <li>Finance</li>
                    <li>Others</li>
                </ul>
            </nav>
        </aside>
    </main>
</body>
</html>
