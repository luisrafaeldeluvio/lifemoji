<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="scripts/script.js" async></script>
    <title>Document</title>
</head>
<body>
    <aside class="playerInfo"> <!-- post-it notes -->
		<section class="playerInfo-profile -section"> <!-- profile, change to <figure>  -->
			<img src="smart_car.jpg" alt="profile"> <!-- or just use svg -->
			<!-- <span>male, 21</span> -->
		</section> 
		<section class="playerInfo-info -section"> <!-- info -->
			<p id="playerInfo-fullname">john doe</p>
			<p>status</p>
			<p>$2,379.21</p>
		</section>
		<section class="playerInfo-stats -section"> <!-- stats -->
            <p id="playerInfo-joyStat">🙂 </p>
			<p id="playerInfo-healthStat">❤️ </p> <!-- use emojis instead (that looks like scribbles) -->
			<p id="playerInfo-smartsStat">🧠 </p>
			<p id="playerInfo-looksStat">👀 </p>
		</section>
        <button class="playerInfo-btn">More</button> <!-- To clipboard -->
    </aside> 
    <main class="main">
        <div class="main-container">
            <article class="main-journal"> <!-- notebook -->
                <div class="main-journalContainer">
                    
                </div>
            </article>
        </div>
        <!-- a button for aging up, at the bottom of journal, will appear as a pencil/pen -->
        <nav class="main-nav"> <!-- bookmarks -->
            <ul>
                <li>Journal</li> <!-- on hover, curl as if going to flip -->
                <li>Goals</li>
                <li>Skills</li>
                <li>School</li>
                <li>Work</li>
                <li>Relations</li>
                <li>Hobbies</li>
                <li>Finance</li>
                <li>Others</li>
            </ul>
        </nav>
    </main>
</body>
</html>

<!-- a cork board where players can see their past characters -->
