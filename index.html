<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <script type="module" src="scripts/script.js" async></script>
    <title>Document</title>
  </head>
  <body>
    <aside class="panel">
      <section class="profile profile--pinned profile--crooked card">
        <img src="./assets/smart_car.jpg" alt="profile" />
        <div class="profile__text">
          <span class="text--m js-profile">male, 21</span>
        </div>
      </section>

      <section class="panel__info card">
        <p class="js-fullname text--m">john doe</p>
        <p class="text--m">status</p>
        <p class="js-money text--m">$2,379.21</p>
      </section>

      <section class="panel__stats card">
        <p class="js-stat-joy">🙂</p>
        <p class="js-stat-health">❤️</p>
        <p class="js-stat-smarts">🧠</p>
        <p class="js-stat-looks">👀</p>
      </section>
    </aside>
    <main class="main">
      <nav class="main__secondary-nav">
        <ul>
          <li id="social">❤️</li>
          <li id="finance">💵</li>
          <li id="achievements">🏆</li>
          <li id="job">💼</li>
        </ul>
      </nav>

      <div class="main__journal">
        <article class="main__journal__social">
          <nav>
            <ul>
              <li>Family</li>
              <li>Friends</li>
              <li>Lover</li>
            </ul>
          </nav>
          <div class="main__journal__family"></div>
          <div class="main__journal__friends"></div>
          <div
            class="main__journal__lovers main__journal__social--opened"
          ></div>
        </article>
        <article class="main__journal__finance">sg</article>
        <article class="main__journal__achievements">gfd</article>
        <article class="main__journal__job">jtgrsf</article>

        <article class="main__journal__journal main__journal--opened">
          <div class="js-journal"></div>
        </article>

        <article class="main__journal__skills">hds</article>
        <article class="main__journal__school">msdr</article>
        <article class="main__journal__hobbies">56hb</article>
        <article class="main__journal__others">brstg5</article>
      </div>

      <nav class="main__primary-nav">
        <ul>
          <li id="journal">Journal</li>
          <li id="skills">Skills</li>
          <li id="school">School</li>
          <li id="hobbies">Hobbies</li>
          <li id="others">Others</li>
        </ul>
      </nav>
    </main>

    <footer>
      <button class="js-growup">Pencil</button>
      <button>Eraser</button>
    </footer>
  </body>
</html>

<!-- a cork board where players can see their past characters -->
